[project]
name = "forgemind"
version = "0.1.0"
description = "AI-powered Open Source Maintainer Copilot"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.scripts]
forgemind = "main:app"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agents*", "commands*", "core*", "storage*"]

[tool.pytest.ini_options]
pythonpath = ["."]
